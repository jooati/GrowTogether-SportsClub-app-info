<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTE Taekwondo App – Egy app, ami összeköt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#40246F; --purple-deep:#241243; --purple-mid:#341C5C;
  --purple-soft:#7A6190; --purple-tint:#F1EDF7;
  --gold:#E3A72F; --gold-soft:#F0C05C;
  --ink:#2A2233; --ink-muted:#6A6175;
  --white:#FFFFFF;
  --fs-caption:13.5px; /* rövid, nagybetűs címkék */
  --fs-meta:14px;      /* másodlagos metaadat */
  --fs-body:15.5px;    /* hosszú kisbetűs szövegtörzs */
  --fs-lede:clamp(16.5px,1.8vw,19.5px);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Archivo',system-ui,sans-serif;
  color:var(--white); background:var(--purple-deep);
  overflow:hidden;
}

/* ============ GÖRGETŐ KONTÉNER ============ */
.snap{height:100svh; overflow-y:auto; scroll-snap-type:y mandatory; scroll-behavior:smooth;}
section.panel{
  min-height:100svh; scroll-snap-align:start;
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden; padding:56px 6vw 60px;
}
.inner{max-width:1060px; width:100%; position:relative; z-index:3;}

/* ============ HÁTTEREK ============ */
.bg-hero{background:
  radial-gradient(1100px 700px at 82% 18%, rgba(227,167,47,.16), transparent 60%),
  radial-gradient(900px 700px at 8% 88%, rgba(122,97,144,.35), transparent 60%),
  linear-gradient(160deg,#1C0E36 0%, #33195E 55%, #40246F 100%);}
.bg-light{background:
  radial-gradient(900px 500px at 90% 8%, rgba(64,36,111,.08), transparent 60%),
  linear-gradient(180deg,#FAF8FC 0%, #F1EDF7 100%);
  color:var(--ink);}
.bg-mid{background:
  radial-gradient(1000px 600px at 12% 12%, rgba(227,167,47,.10), transparent 55%),
  linear-gradient(200deg,#2C1750 0%, #40246F 70%, #4A2B7E 100%);}
.bg-dark{background:
  radial-gradient(800px 500px at 85% 85%, rgba(227,167,47,.12), transparent 60%),
  linear-gradient(180deg,#180B2E 0%, #241243 100%);}
.panel .pattern{position:absolute; inset:0; z-index:1; opacity:.35; pointer-events:none;}
.pattern svg{width:100%; height:100%;}
.dots{position:absolute; inset:0; z-index:1; pointer-events:none;}
.dots i{position:absolute; display:block; border-radius:50%; background:var(--gold); opacity:.22;
  animation:float 14s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-34px) scale(1.15);}}

/* ============ TIPOGRÁFIA ============ */
.eyebrow{display:inline-block; font-size:var(--fs-caption); font-weight:800; letter-spacing:.24em;
  text-transform:uppercase; color:var(--gold);
  border:1.5px solid rgba(227,167,47,.5); padding:8px 16px; margin-bottom:26px;}
.bg-light .eyebrow{border-color:rgba(64,36,111,.35); color:var(--purple);}
h1{font-family:'Anton',sans-serif; font-size:clamp(42px,6.8vw,80px); line-height:1.0;
   text-transform:uppercase; letter-spacing:.01em; margin-bottom:22px;}
h2{font-family:'Anton',sans-serif; font-size:clamp(30px,4.6vw,52px); line-height:1.05;
   text-transform:uppercase; margin-bottom:14px;}
.accent{color:var(--gold);}
.bg-light h2{color:var(--purple);}
.lede{font-size:var(--fs-lede); font-weight:500; max-width:58ch; color:#F7F3FC;}
.lede strong{color:var(--white);}
.bg-light .lede{color:var(--ink-muted);}
.tagline{margin-top:14px; font-family:'Anton',sans-serif; font-size:clamp(18px,2.2vw,24px);
  letter-spacing:.05em; text-transform:uppercase; color:var(--gold);}

/* ============ NYELVVÁLTÓ ============ */
.lang{
  position:fixed; top:20px; right:22px; z-index:60;
  display:flex; border:1.5px solid rgba(255,255,255,.4);
  background:rgba(24,11,46,.55); backdrop-filter:blur(6px);
}
.lang button{
  font-family:'Archivo',sans-serif; font-size:12px; font-weight:800; letter-spacing:.14em;
  color:#CBBFE0; background:none; border:none; padding:9px 14px; cursor:pointer;
}
.lang button.on{background:var(--gold); color:var(--purple-deep);}

/* ============ HERO ============ */
.hero-grid{display:grid; grid-template-columns:1.2fr 1fr; gap:5vw; align-items:center;}
.hero-foot{margin-top:34px; display:flex; gap:26px; flex-wrap:wrap;
  font-size:var(--fs-body); font-weight:700; color:#F0EAF9;}
.hero-foot span::before{content:"◆"; color:var(--gold); margin-right:8px; font-size:10px;}
.kick{width:100%; max-width:400px; margin:0 auto; display:block;}
.arc{stroke-dasharray:520; stroke-dashoffset:520;}
.visible .arc{animation:draw 1.6s .5s ease-out forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
.kick-figure{transform-origin:50% 60%;}
.visible .kick-figure{animation:kickIn .9s cubic-bezier(.2,.9,.3,1.15) both;}
@keyframes kickIn{from{transform:translateX(-36px) rotate(-5deg); opacity:0;} to{transform:none; opacity:1;}}
.star{transform-origin:center; opacity:0;}
.visible .star{animation:pop .5s 1.2s ease-out forwards;}
.visible .star.s2{animation-delay:1.45s;}
.visible .star.s3{animation-delay:1.7s;}
@keyframes pop{from{opacity:0; transform:scale(.2);} to{opacity:1; transform:scale(1);}}
.scroll-hint{position:absolute; left:50%; bottom:74px; transform:translateX(-50%); z-index:4;
  font-size:var(--fs-caption); letter-spacing:.22em; text-transform:uppercase; font-weight:700; color:#CBBFE0;
  display:flex; flex-direction:column; align-items:center; gap:8px;}
.scroll-hint b{display:block; width:2px; height:34px; background:linear-gradient(var(--gold),transparent);
  animation:hint 1.8s ease-in-out infinite;}
@keyframes hint{0%,100%{transform:scaleY(.4); opacity:.4;}50%{transform:scaleY(1); opacity:1;}}

/* ============ KÁRTYÁK ============ */
.roles{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:24px;}
.role{background:var(--white); border-top:5px solid var(--purple);
  box-shadow:0 14px 40px rgba(64,36,111,.12); padding:20px 20px 16px;}
.role h3{font-family:'Anton',sans-serif; font-size:18px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--purple); margin-bottom:10px;}
.role ul{list-style:none;}
.role li{font-size:var(--fs-body); font-weight:500; color:var(--ink); padding:7px 0 7px 22px;
  position:relative; border-bottom:1px solid rgba(64,36,111,.09);}
.role li:last-child{border-bottom:none;}
.role li::before{content:""; position:absolute; left:0; top:14px; width:11px; height:11px;
  background:var(--gold); clip-path:polygon(0 0,100% 50%,0 100%);}

.features{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:24px;}
.feat{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14);
  padding:16px 18px 14px; backdrop-filter:blur(2px);
  transition:transform .35s ease, border-color .35s ease, background .35s ease;}
.feat:hover{transform:translateY(-6px); border-color:rgba(227,167,47,.55); background:rgba(255,255,255,.08);}
.feat svg{width:28px; height:28px; margin-bottom:8px;}
.feat h4{font-size:14.5px; font-weight:700; margin-bottom:4px; color:var(--white);}
.feat p{font-size:var(--fs-body); color:#EDE6F7; line-height:1.5;}
.feat-wide{grid-column:1 / -1; display:flex; align-items:center; gap:16px;}
.feat-wide svg{margin-bottom:0; flex:0 0 28px;}
.feat-wide h4{margin-bottom:2px;}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.more-grid svg{width:26px;height:26px;margin-bottom:6px;}
.more-grid b{display:block;font-size:14px;color:var(--white);margin-bottom:3px;}
.more-grid p{font-size:13px;color:#CFC4E2;line-height:1.5;}

/* ============ VERSENYNAP ============ */
.day-grid{display:grid; grid-template-columns:1.05fr 1fr; gap:5vw; align-items:center;}
.sched{background:var(--white); color:var(--ink);
  box-shadow:0 24px 70px rgba(0,0,0,.35); padding:20px 20px 14px;}
.sched-head{display:flex; justify-content:space-between; align-items:center;
  border-bottom:2px solid var(--purple); padding-bottom:10px; margin-bottom:6px;}
.sched-head b{font-family:'Anton',sans-serif; letter-spacing:.05em; text-transform:uppercase;
  color:var(--purple); font-size:15px;}
.sched-head span{font-size:var(--fs-caption); font-weight:800; letter-spacing:.12em; color:var(--gold-soft);
  background:var(--purple); padding:5px 10px;}
.row{display:flex; align-items:center; gap:12px; padding:11px 4px;
  border-bottom:1px solid #EDE8F4; opacity:0; transform:translateY(14px);}
.visible .row{animation:rowIn .5s ease-out forwards;}
.visible .row:nth-child(2){animation-delay:.15s;}
.visible .row:nth-child(3){animation-delay:.3s;}
.visible .row:nth-child(4){animation-delay:.45s;}
.visible .row:nth-child(5){animation-delay:.6s;}
@keyframes rowIn{to{opacity:1; transform:none;}}
.row:last-child{border-bottom:none;}
.mno{font-family:'Anton',sans-serif; font-size:16px; color:var(--purple); min-width:48px;}
.rname{flex:1;}
.rname b{display:block; font-size:14px;}
.rname small{font-size:var(--fs-meta); color:var(--ink-muted);}
.corner{width:10px; height:26px; flex:0 0 10px;}
.corner.blue{background:#2D6FB7;} .corner.red{background:#C33B31;}
.eta{font-weight:800; font-size:13.5px; color:var(--purple);
  background:var(--purple-tint); padding:6px 10px; white-space:nowrap;}
.res{font-weight:800; font-size:12.5px; color:#1E7A4B; background:#E8F5EE;
  padding:6px 10px; white-space:nowrap;}

/* ============ BIZALOM ============ */
.trust-grid{display:grid; grid-template-columns:120px 1fr; gap:34px; align-items:center;}
.chips{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
.chip{font-size:var(--fs-caption); font-weight:800; letter-spacing:.05em;
  border:1px solid rgba(255,255,255,.55); padding:9px 16px;}

/* ============ CTA ============ */
.cta-box{text-align:center; max-width:760px; margin:0 auto;}
.badge{display:inline-block; border:2px solid var(--gold); padding:16px 30px; margin-top:30px;
  animation:glow 2.6s ease-in-out infinite;}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(227,167,47,0);}50%{box-shadow:0 0 34px rgba(227,167,47,.35);}}
.badge .d{font-family:'Anton',sans-serif; font-size:24px; color:var(--gold); letter-spacing:.05em;}
.badge .l{font-size:var(--fs-caption); letter-spacing:.2em; text-transform:uppercase; font-weight:800;
  margin-top:4px; color:#F7F3FC;}
.cta-guest{margin-top:20px; font-size:var(--fs-body); font-weight:800;
  letter-spacing:.04em; color:var(--gold);}
.cta-foot{margin-top:44px; font-size:var(--fs-meta); color:#DFD6EE; font-weight:600; letter-spacing:.06em;}

/* ============ ÖV-HALADÁSJELZŐ (alul) ============ */
.beltbar{position:fixed; left:0; bottom:0; width:100%; z-index:50; height:14px; pointer-events:none;}
.beltbar .track{position:relative; width:100%; height:10px; background:rgba(255,255,255,.14);}
.beltbar .fill{position:absolute; left:0; top:0; bottom:0; width:0%;
  background:#F2F0EC; transition:width .25s ease-out, background .5s ease;}

/* ============ ÖV-LÉPEGETŐ (jobb oldal) ============ */
.beltnav{position:fixed; right:18px; top:50%; transform:translateY(-50%); z-index:52;
  display:flex; flex-direction:column; gap:12px;}
.beltnav a{
  position:relative; display:block; width:34px; height:12px;
  border:none; opacity:.55; transition:.3s;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.beltnav a::after{ /* övcsomó */
  content:""; position:absolute; left:50%; top:50%;
  width:8px; height:16px; transform:translate(-50%,-50%) rotate(18deg);
  background:inherit; border:2px solid rgba(24,11,46,.45);
}
.beltnav a.on{opacity:1; transform:scale(1.22); box-shadow:0 0 14px rgba(227,167,47,.5);}
.beltnav .w{background:#F2F0EC;} .beltnav .y{background:#F0C93C;}
.beltnav .g{background:#3E9A56;} .beltnav .b{background:#2D6FB7;}
.beltnav .r{background:#C33B31;} .beltnav .k{background:#221E28;}

/* ============ REVEAL ============ */
.rv{opacity:0; transform:translateY(28px); transition:opacity .7s ease, transform .7s ease;}
.rv.d1{transition-delay:.12s;} .rv.d2{transition-delay:.24s;} .rv.d3{transition-delay:.36s;}
.visible .rv{opacity:1; transform:none;}

/* ============ RESZPONZÍV ============ */
@media (max-height:780px){
  .eyebrow{margin-bottom:16px;}
  h2{font-size:clamp(26px,4vw,42px); margin-bottom:10px;}
  .lede{font-size:14.5px;}
  --fs-body-compact:13px;
  .feat p,.role li{font-size:14.5px;}
  .kick{max-width:320px;}
  section.panel{padding:44px 6vw 46px;}
}
@media (max-height:640px){
  .snap{scroll-snap-type:y proximity;}
}
@media (max-width:900px){
  .hero-grid,.day-grid{grid-template-columns:1fr; gap:30px;}
  .kick{max-width:280px;}
  .roles,.features{grid-template-columns:1fr; gap:14px;}
  .more-grid{grid-template-columns:1fr;gap:12px;}
  .snap{scroll-snap-type:y proximity;}
  section.panel{padding:64px 6vw 96px; min-height:auto;}
  .beltnav{display:none;}
  .trust-grid{grid-template-columns:1fr;}
  .scroll-hint{display:none;}
  .lang{top:14px; right:14px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important;}
  .rv,.row,.star{opacity:1; transform:none;}
}
</style>
</head>
<body>

<!-- nyelvváltó -->

  <button id="btnEn" type="button">EN</button>
</div>

<div class="snap" id="snap">

  <!-- ============ 1 · HERO ============ -->
  <section class="panel bg-hero" data-belt="#F2F0EC">
    <div class="dots">
      <i style="left:8%;top:20%;width:8px;height:8px;"></i>
      <i style="left:22%;top:70%;width:5px;height:5px;animation-delay:2s;"></i>

             data-en="More than a taekwondo app: a sports-club management platform that connects coaches, parents and athletes. The goal: clear, trustworthy and up-to-date information for everyone – to make everyday club life easier."></p>

          <div class="hero-foot rv d3">
            <span data-hu="Android · iPhone · böngésző" data-en="Android · iPhone · browser"></span>
            <span data-hu="Magyar és angol nyelven" data-en="In Hungarian and English"></span>

        </div>
        <div>

    </div>
    <div class="scroll-hint"><span data-hu="Görgess" data-en="Scroll"></span><b></b></div>
  </section>

  <!-- ============ 2 · KINEK MIT AD ============ -->
  <section class="panel bg-light" data-belt="#F0C93C">
    <div class="inner">
      <span class="eyebrow" data-hu="Kinek mit ad?" data-en="Who gets what?"></span>
      <h2 class="rv d1"><span data-hu="Három nézőpont," data-en="Three viewpoints,"></span> <span style="color:var(--gold-deep,#C88A15)" data-hu="egy rendszer." data-en="one system."></span></h2>

          <h3 data-hu="Szülőknek" data-en="For parents"></h3>

            <li data-hu="Övvizsgák, eredmények, sportorvosi lejárat egy helyen" data-en="Belt exams, results and medical expiry in one place"></li>
            <li data-hu="„Mikor és melyik páston jön a gyerekem?" és „Nem vagyok ott, mi lett az eredmény?"" data-en="“When and on which court is my child up?” and “I'm not there – what was the result?”"></li>
            <li data-hu="Gyermekem adatai biztonságban" data-en="My child's data kept safe"></li>
          </ul>
        </div>
        <div class="role rv d3">
          <h3 data-hu="Sportolóknak" data-en="For athletes"></h3>
          <ul>

<!-- öv-lépegető -->
<nav class="beltnav" id="beltnav" aria-label="Szakaszok / Sections"></nav>

<script>
(function(){
  var snap = document.getElementById('snap');
  var panels = Array.prototype.slice.call(document.querySelectorAll('.panel'));
  var fill = document.getElementById('beltFill');
  var nav = document.getElementById('beltnav');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var beltClasses = ['w','y','g','b','r','k'];
  var beltNames = ['Fehér öv / White belt','Sárga öv / Yellow belt','Zöld öv / Green belt','Kék öv / Blue belt','Piros öv / Red belt','Fekete öv / Black belt'];

  // öv-lépegető felépítése
  panels.forEach(function(p, i){
    var a = document.createElement('a');
    a.href = '#';
    a.className = beltClasses[i] || 'w';
    a.setAttribute('aria-label', beltNames[i] || ((i+1)+'. szakasz'));
    a.title = beltNames[i] || '';
    a.addEventListener('click', function(e){
      e.preventDefault();
      p.scrollIntoView({behavior: reduced ? 'auto' : 'smooth'});
    });
    nav.appendChild(a);
  });
  var belts = Array.prototype.slice.call(nav.children);

  // reveal + aktív szakasz
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        en.target.classList.add('visible');
        var idx = panels.indexOf(en.target);
        belts.forEach(function(d,i){ d.classList.toggle('on', i===idx); });
        fill.style.background = en.target.dataset.belt;
      }
    });
  }, {root: snap, threshold: 0.45});
  panels.forEach(function(p){ io.observe(p); });

  // öv-csík a görgetés szerint
  function onScroll(){
    var max = snap.scrollHeight - snap.clientHeight;
    var pct = max > 0 ? (snap.scrollTop / max) * 100 : 0;
    fill.style.width = Math.max(pct, 2) + '%';
  }
  snap.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  // a haladáscsík ne lógjon a görgetősáv alá
  var beltbarEl = document.querySelector('.beltbar');
  function fitBeltbar(){
    var sbw = window.innerWidth - snap.clientWidth;
    beltbarEl.style.width = sbw > 0 ? 'calc(100% - ' + sbw + 'px)' : '100%';
  }
  window.addEventListener('resize', fitBeltbar);
  fitBeltbar();

  // ============ NYELVVÁLTÁS ============
  var btnHu = document.getElementById('btnHu');
  var btnEn = document.getElementById('btnEn');
  function setLang(lang){
    document.documentElement.setAttribute('lang', lang);
    document.querySelectorAll('[data-hu]').forEach(function(el){
      el.textContent = el.getAttribute('data-' + lang);
    });
    btnHu.classList.toggle('on', lang === 'hu');
    btnEn.classList.toggle('on', lang === 'en');
    document.title = lang === 'hu'
      ? 'UTE Taekwondo App – Egy app, ami összeköt'
      : 'UTE Taekwondo App – One app that connects';
  }
  btnHu.addEventListener('click', function(){ setLang('hu'); });
  btnEn.addEventListener('click', function(){ setLang('en'); });
  setLang('hu');
})();
</script>
</body>
</html>
